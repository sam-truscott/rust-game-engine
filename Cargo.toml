[package]
name = "game"
version = "0.1.0"
edition = "2024"

[dependencies]
macroquad = { version = "0.4.16", default-features = false }
mlua = { version = "0.12.2", features = ["lua54", "vendored"] }
rust-embed = "8.13.0"

# miniquad 0.4.11 only stores its window state pointer on x86/x86_64, so on aarch64-pc-windows-msvc
# no input or close events reach the game. vendor/miniquad changes two cfg guards; see its PATCHES.md.
[patch.crates-io]
miniquad = { path = "vendor/miniquad" }
