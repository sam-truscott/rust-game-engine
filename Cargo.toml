[package]
name = "wumpus-g-engine"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "WumpusGEngine"
path = "src/main.rs"

[dependencies]
macroquad = { version = "0.4.16", default-features = false }
mlua = { version = "0.12.2", features = ["lua54", "vendored"] }
rust-embed = { version = "8.13.0", features = ["include-exclude"] }

# Unoptimised image decoding made changing room take up to a second in debug builds.
[profile.dev.package."*"]
opt-level = 3

# miniquad 0.4.11 only stores its window state pointer on x86/x86_64, so on aarch64-pc-windows-msvc
# no input or close events reach the game. patched/miniquad is the published crate plus a small patch;
# build it with tools/patch-miniquad.sh (see patches/README.md).
[patch.crates-io]
miniquad = { path = "patched/miniquad" }
